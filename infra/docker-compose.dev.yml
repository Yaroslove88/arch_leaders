version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadership-architect-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadership_architect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leadership_architect}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadership_architect}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

